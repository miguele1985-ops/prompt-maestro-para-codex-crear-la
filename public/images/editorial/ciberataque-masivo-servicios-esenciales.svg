<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><title>El ciberataque que no ves venir: qué pasaría si durante varios días fallaran bancos, Internet o servicios esenciales</title><desc>Diagrama editorial original, no representación de un incidente ni identificación de especies.</desc><rect width="1200" height="750" fill="#1d3428"/><path d="M700 0v750" stroke="#77948a" stroke-width="2"/><text x="60" y="67" fill="#eca56a" font-family="Arial" font-size="18">MODO CRISIS SURVIVAL · CUADERNO DE CAMPO</text><text x="60" y="155" fill="#f2f5e9" font-family="Arial" font-weight="700" font-size="46">El ciberataque que no ves</text><text x="60" y="217" fill="#f2f5e9" font-family="Arial" font-weight="700" font-size="46">venir: qué pasaría si</text><text x="60" y="279" fill="#f2f5e9" font-family="Arial" font-weight="700" font-size="46">durante varios días</text><text x="60" y="341" fill="#f2f5e9" font-family="Arial" font-weight="700" font-size="46">fallaran bancos, Internet</text><text x="60" y="403" fill="#f2f5e9" font-family="Arial" font-weight="700" font-size="46">o servicios esenciales</text><rect x="790" y="290" width="240" height="150" rx="10" fill="#739383"/><path d="m830 290 90-80" stroke="#dce7d8" stroke-width="7"/><circle cx="850" cy="360" r="30" fill="#dce7d8"/><path d="M920 325h75m-75 25h75m-75 25h75" stroke="#1d3428" stroke-width="8"/><path d="M765 510h290" stroke="#e6a060" stroke-width="3"/><text x="910" y="550" text-anchor="middle" fill="#f2f5e9" font-family="Arial" font-size="20">PREPARAR · COMPROBAR · REVISAR</text><text x="60" y="675" fill="#c7d4c9" font-family="Arial" font-size="18">Esta crisis podría empezar sin que escuchases nada</text><text x="60" y="710" fill="#c7d4c9" font-family="Arial" font-size="16">Diagrama propio · CC BY 4.0 · ciberataque-masivo-servicios-esenciales</text></svg>